
# AgentOps Intelligence - Continuous Integration
# Owner: Tony Anuge
# Deliverable: D01

name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only needs permission to read repository files.
permissions:
  contents: read

jobs:
  quality-checks:
    name: Lint, Types and Tests
    runs-on: ubuntu-24.04

    steps:
      # Download repository files into the runner.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Install the approved uv version.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"

      # Install Python using the project's version pin.
      - name: Install Python
        run: uv python install 3.12

      # Install dependencies from the committed lockfile.
      - name: Synchronise dependencies
        run: uv sync --locked

      # Check code style and formatting.
      - name: Ruff lint
        run: uv run --locked ruff check scripts/ tests/

      - name: Ruff format
        run: uv run --locked ruff format --check scripts/ tests/

      # Check Python type annotations.
      - name: Mypy
        run: uv run --locked mypy scripts/ tests/

      # Execute automated tests.
      - name: Pytest
        run: uv run --locked pytest -v

      # Reject prohibited files before publication.
      - name: Check repository publication rules
        run: uv run --locked python -m scripts.check_publication

      # Scan Git history using a pinned, checksum-verified Gitleaks binary.
      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail

          version="8.30.1"
          archive="$RUNNER_TEMP/gitleaks_${version}_linux_x64.tar.gz"

          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"

          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check

          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

          "$RUNNER_TEMP/gitleaks" version
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner .